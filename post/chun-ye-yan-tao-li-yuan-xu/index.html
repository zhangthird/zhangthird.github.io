            <h2 class="post-title">春夜宴桃李园序</h2>
            <div class="post-date">2022-04-28</div>
            
            <div class="post-content" v-pre>
              <p>夫天地者万物之逆旅也；光阴者百代之过客也。<br>
而浮生若梦，为欢几何？<br>
古人秉烛夜游，良有以也。<br>
况阳春召我以烟景，大块假我以文章。<br>
会桃花之芳园，序天伦之乐事。<br>
群季俊秀，皆为惠连；吾人咏歌，独惭康乐。<br>
幽赏未已，高谈转清。<br>
开琼筵以坐花，飞羽觞而醉月。<br>
不有佳咏，何伸雅怀？<br>
如诗不成，罚依金谷酒数。</p>
